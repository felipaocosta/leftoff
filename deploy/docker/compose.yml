# LeftOff on a home server. Usage (from the repository root):
#   docker compose -f deploy/docker/compose.yml up -d --build
# The UI is at http://<server-ip>:8080. Data lives in ./data next to this file.
services:
  leftoff:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: leftoff:latest
    container_name: leftoff
    restart: unless-stopped
    # Run as the owner of ./data (on TrueNAS, the "apps" user is 568:568).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: America/Sao_Paulo
      # AUTH_TOKEN: "troque-por-um-token-longo"   # recommended outside a trusted LAN
      CHECK_INTERVAL_HOURS: "6"
      # FLARESOLVERR_URL: http://flaresolverr:8191  # enable with the flaresolverr profile
      # OLLAMA_URL: http://ollama:11434              # recipe generation with a local model
      # OLLAMA_MODEL: qwen2.5-coder:14b
      # NTFY_URL: https://ntfy.sh/troque-por-um-topico-dificil  # new-chapter notifications
      # DISCORD_WEBHOOK: https://discord.com/api/webhooks/...
      # TELEGRAM_TOKEN: "123456:ABC..."
      # TELEGRAM_CHAT_ID: "123456789"

  # Optional: solves Cloudflare challenges for protected sites.
  #   docker compose -f deploy/docker/compose.yml --profile cloudflare up -d
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    profiles: ["cloudflare"]
    environment:
      LOG_LEVEL: info
      TZ: America/Sao_Paulo
