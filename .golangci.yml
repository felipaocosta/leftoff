version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - funlen
    - gocritic
    - misspell
    - nestif
    - noctx
    - revive
  settings:
    funlen:
      # RULES §2.2: ~50 lines per function (small tolerance).
      lines: 60
      statements: -1
    nestif:
      min-complexity: 4
    misspell:
      # Portuguese/Spanish words in challenge-page titles, not typos.
      ignore-rules: [momento, capitulo]
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: error-strings
        - name: context-as-argument
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]

formatters:
  enable:
    - gofmt
    - goimports
